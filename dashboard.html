<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFNexus Dashboard</title>
    <!-- Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .profile-card, .config-card, .guild-select-card {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '▼';
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            pointer-events: none;
            color: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center min-h-screen p-6">

    <h1 class="text-4xl font-bold mb-8 text-cyan-400">PFNexus Dashboard</h1>

    <!-- Main Dashboard Content -->
    <div id="dashboard-content" class="w-full max-w-lg">
        <!-- User Profile Card -->
        <div id="profile-card" class="bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700 w-full mb-8 profile-card">
            <div class="flex flex-col items-center">
                <img id="avatar" class="w-24 h-24 rounded-full mb-4 border-2 border-cyan-400 object-cover" src="https://placehold.co/100x100/1f2937/a3a3a3?text=?" alt="User Avatar">
                <h2 id="username" class="text-2xl font-bold mb-1">User</h2>
                <p id="user-id" class="text-slate-400 text-sm">ID: loading...</p>
                <button id="logout-btn" class="mt-6 px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold transition-all duration-300 transform hover:scale-105">
                    Logout
                </button>
            </div>
        </div>

        <!-- Guild Selection Card -->
        <div class="bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700 w-full mb-8 guild-select-card">
            <h2 class="text-2xl font-bold mb-6 text-center text-cyan-400">Select Server</h2>
            <div id="guild-select-area" class="space-y-4">
                <div class="select-wrapper">
                    <select id="guild-select" class="mt-1 block w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500 text-white appearance-none">
                        <option value="">-- Please select a server --</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Server Configuration Card -->
        <div id="config-card" class="bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700 w-full config-card hidden">
            <h2 class="text-2xl font-bold mb-6 text-center text-cyan-400">Server Configuration</h2>
            <div id="message-area" class="p-3 mb-4 text-sm text-center rounded-lg hidden"></div>
            
            <div class="space-y-4">
                <div>
                    <label for="welcomeMessage" class="block text-sm font-medium text-slate-300">Welcome Message</label>
                    <textarea
                        id="welcomeMessage"
                        name="welcomeMessage"
                        rows="3"
                        class="mt-1 block w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500 text-white"
                        placeholder="Welcome to the server, {user}!"
                    ></textarea>
                </div>
                <div>
                    <label for="welcomeChannelId" class="block text-sm font-medium text-slate-300">Welcome Channel ID</label>
                    <input
                        type="text"
                        id="welcomeChannelId"
                        name="welcomeChannelId"
                        class="mt-1 block w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500 text-white"
                        placeholder="Enter channel ID"
                    >
                </div>
                <div>
                    <label for="customPrefix" class="block text-sm font-medium text-slate-300">Custom Prefix</label>
                    <input
                        type="text"
                        id="customPrefix"
                        name="customPrefix"
                        class="mt-1 block w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500 text-white"
                        placeholder="!"
                    >
                </div>
            </div>
            
            <div class="mt-6 text-center">
                <button
                    id="save-btn"
                    class="w-full px-6 py-3 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-bold transition-all duration-300 transform hover:scale-105"
                >
                    Save Server Configuration
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs from CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables for Firebase services
        let app;
        let db;
        let auth;
        let discordUser = null;
        let appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let unsubscribeConfig = null; // To store the onSnapshot listener function for cleanup

        // Get DOM elements
        const profileCard = document.getElementById('profile-card');
        const usernameElem = document.getElementById('username');
        const userIdElem = document.getElementById('user-id');
        const avatarElem = document.getElementById('avatar');
        const logoutBtn = document.getElementById('logout-btn');
        const saveBtn = document.getElementById('save-btn');
        const guildSelect = document.getElementById('guild-select');
        const configCard = document.getElementById('config-card');
        const messageArea = document.getElementById('message-area');

        const welcomeMessageInput = document.getElementById('welcomeMessage');
        const welcomeChannelIdInput = document.getElementById('welcomeChannelId');
        const customPrefixInput = document.getElementById('customPrefix');

        // Firebase configuration. Use the provided global variable if it exists.
        const firebaseConfig = typeof __firebase_config !== 'undefined'
            ? JSON.parse(__firebase_config)
            : {
                apiKey: "YOUR_API_KEY", // Placeholder
                authDomain: "YOUR_AUTH_DOMAIN", // Placeholder
                projectId: "YOUR_PROJECT_ID", // Placeholder
                storageBucket: "YOUR_STORAGE_BUCKET", // Placeholder
                messagingSenderId: "YOUR_MESSAGING_SENDER_ID", // Placeholder
                appId: "YOUR_APP_ID", // Placeholder
                measurementId: "YOUR_MEASUREMENT_ID" // Placeholder
            };

        // Custom auth token. Use the provided global variable if it exists.
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        let currentUserId = null;

        // Check for user ID in URL on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentUserId = urlParams.get('userId');

            if (!currentUserId) {
                // If no user ID is in the URL, redirect back to the login page
                showMessage('No user ID found. Redirecting to login.', 'error');
                setTimeout(() => window.location.href = 'index.html', 2000);
                return;
            }

            // Update the profile card with the user ID from the URL
            usernameElem.textContent = `User`;
            userIdElem.textContent = `ID: ${currentUserId}`;

            // Initialize Firebase
            try {
                if (firebaseConfig && firebaseConfig.apiKey) {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                        showMessage('Using anonymous authentication as no custom token was provided.', 'warning');
                    }
                } else {
                    showMessage('Firebase config is missing or incomplete.', 'error');
                }
            } catch (e) {
                showMessage('Failed to initialize Firebase: ' + e.message, 'error');
                console.error('Firebase initialization error:', e);
            }

            // On successful auth, load the rest of the dashboard data
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    console.log('Firebase user authenticated:', user.uid);
                    await loadDiscordGuilds(currentUserId);
                } else {
                    console.warn('Firebase user is not authenticated.');
                    // Redirect to login if not authenticated
                    showMessage('Session expired. Redirecting to login.', 'error');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                }
            });
        });

        // Function to show messages in a stylized box
        function showMessage(message, type) {
            messageArea.textContent = message;
            messageArea.classList.remove('hidden', 'bg-green-700', 'bg-red-700', 'bg-yellow-700');
            if (type === 'success') {
                messageArea.classList.add('bg-green-700');
            } else if (type === 'error') {
                messageArea.classList.add('bg-red-700');
            } else if (type === 'warning') {
                messageArea.classList.add('bg-yellow-700');
            }
        }

        // Function to load the user's Discord guilds from Firestore
        async function loadDiscordGuilds(userId) {
            try {
                // The bot writes the guilds for the user to this location
                const guildsRef = doc(db, `artifacts/${appId}/users/${userId}/discordData/guilds`);
                
                // Use onSnapshot for real-time updates
                onSnapshot(guildsRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const guilds = docSnap.data().list || [];
                        console.log('Guilds loaded:', guilds);
                        populateGuildSelect(guilds);
                    } else {
                        console.warn('No guild data found for this user.');
                        showMessage('No guild data found. Please ensure the bot is in your servers and you have permission.', 'warning');
                        populateGuildSelect([]);
                    }
                }, (error) => {
                    console.error('Error fetching guilds:', error);
                    showMessage('Error loading guild data: ' + error.message, 'error');
                    populateGuildSelect([]);
                });
            } catch (e) {
                console.error('Error setting up guild listener:', e);
                showMessage('Failed to load guilds. Please check the console for details.', 'error');
                populateGuildSelect([]);
            }
        }

        // Function to populate the dropdown with guild options
        function populateGuildSelect(guilds) {
            guildSelect.innerHTML = '<option value="">-- Please select a server --</option>';
            guilds.forEach(guild => {
                const option = document.createElement('option');
                option.value = guild.id;
                option.textContent = guild.name;
                guildSelect.appendChild(option);
            });
            // Show the guild select and hide config card on repopulate
            configCard.classList.add('hidden');
        }

        // Event listener for guild selection change
        guildSelect.addEventListener('change', (e) => {
            const guildId = e.target.value;
            if (guildId) {
                loadGuildConfig(guildId);
            } else {
                configCard.classList.add('hidden');
                welcomeMessageInput.value = '';
                welcomeChannelIdInput.value = '';
                customPrefixInput.value = '';
                if (unsubscribeConfig) {
                    unsubscribeConfig(); // Cleanup old listener
                    unsubscribeConfig = null;
                }
            }
        });

        // Function to load a specific guild's configuration from Firestore
        function loadGuildConfig(guildId) {
            // Unsubscribe from previous listener if it exists
            if (unsubscribeConfig) {
                unsubscribeConfig();
            }
            
            const configRef = doc(db, `artifacts/${appId}/public/data/guildConfigs/${guildId}`);
            
            // Listen for real-time changes to the guild configuration
            unsubscribeConfig = onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    console.log('Config loaded:', data);
                    welcomeMessageInput.value = data.welcomeMessage || '';
                    welcomeChannelIdInput.value = data.welcomeChannelId || '';
                    customPrefixInput.value = data.customPrefix || '!';
                } else {
                    console.warn(`No config found for guild ${guildId}, using defaults.`);
                    welcomeMessageInput.value = '';
                    welcomeChannelIdInput.value = '';
                    customPrefixInput.value = '!';
                }
                configCard.classList.remove('hidden');
            }, (error) => {
                console.error('Error fetching config:', error);
                showMessage('Error loading configuration: ' + error.message, 'error');
            });
        }

        // Event listener for the save button
        saveBtn.addEventListener('click', async () => {
            const selectedGuildId = guildSelect.value;
            if (!selectedGuildId) {
                showMessage('Please select a server before saving.', 'error');
                return;
            }

            const configRef = doc(db, `artifacts/${appId}/public/data/guildConfigs/${selectedGuildId}`);
            
            const newConfig = {
                welcomeMessage: welcomeMessageInput.value,
                welcomeChannelId: welcomeChannelIdInput.value,
                customPrefix: customPrefixInput.value,
            };

            try {
                await setDoc(configRef, newConfig);
                showMessage('Configuration saved successfully!', 'success');
            } catch (e) {
                console.error('Error saving config:', e);
                showMessage('Failed to save configuration: ' + e.message, 'error');
            }
        });

        // Event listener for the logout button
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                // Redirect back to the login page
                window.location.href = 'index.html';
            } catch (e) {
                console.error('Logout failed:', e);
                showMessage('Logout failed. Please try again.', 'error');
            }
        });

    </script>
</body>
</html>
